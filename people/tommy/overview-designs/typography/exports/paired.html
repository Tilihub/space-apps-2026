<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PULSE · Soft Panels and Alloy typography</title><link rel="stylesheet" href="/integration/onboard-app/pages/soft-panels.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;color:#203040;font-family:system-ui,sans-serif}body{width:1280px;padding:25px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.sheet-head h1{font:800 27px/1.2 system-ui;margin:0;letter-spacing:-.035em}.sheet-head p{font:500 12px/1.5 system-ui;margin:6px 0 0;color:#5a6879}.sheet-head>span{font:700 12px system-ui}.font-row{margin-bottom:21px}.font-label{display:flex;align-items:center;gap:10px;margin-bottom:9px;font:650 14px system-ui}.font-label b{background:#293a4c;color:white;border-radius:5px;padding:3px 7px}.font-label small{font:500 12px system-ui;color:#596b7e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sample{border-radius:13px;padding:16px 18px;background:linear-gradient(140deg,#282c2e,#1c2023);border:1px solid #393e42;border-top-color:#d8ae5750;color:#f4f2e8;--sample-muted:#bfc4c2;--sample-accent:#e9bd64;font-family:var(--ui);box-shadow:0 6px 16px #0000000b}.sample.alloy{border-radius:6px;background:linear-gradient(160deg,#343d43,#293035);border-color:#4b555b;border-top:2px solid #d0ae68;--sample-muted:#bec5c5;--sample-accent:#f0c56b}.sample-tag{font:650 9px system-ui;letter-spacing:.14em;color:var(--sample-accent);margin-bottom:12px}.spec-columns{display:grid;grid-template-columns:1.1fr .7fr 1fr;gap:12px;align-items:start}.sample h2{font-family:var(--heading);font-size:23px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px;line-height:1.3}.sample p{font-size:13px;font-weight:600;line-height:1.5;margin:0 0 7px}.sample small{font-size:11px;color:var(--sample-muted);font-weight:600}.sample .numeral{font-family:var(--number);font-size:31px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;display:block}.sample .numeral+small{display:block;margin-top:4px}.sample .sets{font-family:var(--number);font-size:24px;color:var(--sample-accent);margin-top:12px;font-weight:650}.sample .chat{font-size:13px;font-weight:500}.sample .control{border:1px solid #e9bd6455;background:#e9bd6413;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:700;display:inline-block;margin-top:6px}.foot{display:flex;justify-content:space-between;font:500 10px system-ui;color:#607082;margin-top:4px}</style></head><body><div class="sheet-head"><div><h1>PULSE / One font system, every screen</h1><p>Same typography in Soft Panels and Alloy. Titles, questions, small labels, numbers, chat and buttons.</p></div><span id="range"></span></div><div id="rows"></div><div class="foot"><span>Soft Panels remains selected · Alloy is a comparison · Identical content and sizing</span><span>Static appearance study · No backend changes</span></div><script type="module">const all=await fetch('../recipes.json').then(r=>r.json());const group=new URLSearchParams(location.search).get('group')==='2'?2:1;const rows=all.slice((group-1)*4,group*4);document.getElementById('range').textContent=rows[0].id+' — '+rows.at(-1).id;const specimen=surface=>`<div class="sample ${surface==='Alloy'?'alloy':''}"><div class="sample-tag">${surface.toUpperCase()}</div><div class="spec-columns"><div><h2>Daily check-in</h2><p>How stressed did you feel?</p><small>A short note (optional)</small></div><div><b class="numeral">63</b><small>resting pulse · bpm</small><div class="sets">4 × 12</div></div><div><p>Allergies on file</p><p class="chat">Let's take a moment.</p><small>5 scheduled doses left</small><br><span class="control">Save check-in</span></div></div></div>`;document.getElementById('rows').innerHTML=rows.map(t=>`<section class="font-row"><div class="font-label"><b>${t.id}</b><span>${t.name}</span><small>${t.fonts}</small></div><div class="pair" style="--ui:'${t.ui}',system-ui;--heading:'${t.heading}',system-ui;--number:'${t.number}',system-ui">${specimen('Soft Panels')}${specimen('Alloy')}</div></section>`).join('');</script></body></html>
