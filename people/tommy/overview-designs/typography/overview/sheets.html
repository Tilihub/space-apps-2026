<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PULSE · Overview font comparison</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;color:#203040;font-family:system-ui,sans-serif}body{width:1280px;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}h1{font:800 26px/1.2 system-ui;letter-spacing:-.035em;margin:0}.head p{font-size:12px;color:#5c6a7c;margin:6px 0 0}.head>span{font-size:12px;font-weight:700}.row{margin-bottom:22px}.label{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:9px}.label b{background:#233448;color:white;border-radius:5px;padding:3px 7px}.label small{font-size:12px;color:#5b6c80}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.surface{font-size:10px;color:#536277;margin-bottom:7px;font-weight:700;letter-spacing:.1em}img{width:100%;display:block;border-radius:7px;border:1px solid #c9d1dc;box-shadow:0 7px 20px #2439500a}.foot{display:flex;justify-content:space-between;font-size:10px;color:#5f6f82}</style></head><body><div class="head"><div><h1>PULSE / Typography on the full Overview</h1><p>Same body, layout, values and dashed instruments. Soft Panels left / Alloy right.</p></div><span id="range"></span></div><main id="rows"></main><div class="foot"><span>Soft Panels remains selected · Typeface pending · Static visual review</span><span>Same font size and weight across all options</span></div><script type="module">const all=await fetch('../recipes.json').then(r=>r.json());const group=Math.max(1,Math.min(4,Number(new URLSearchParams(location.search).get('group')??1)));const rows=all.slice((group-1)*2,group*2);document.getElementById('range').textContent=rows[0].id+' — '+rows.at(-1).id;document.getElementById('rows').innerHTML=rows.map(t=>`<section class="row"><div class="label"><b>${t.id}</b><strong>${t.name}</strong><small>${t.fonts}</small></div><div class="pair">${['soft','alloy'].map(surface=>`<div><div class="surface">${surface==='soft'?'SOFT PANELS':'ALLOY'}</div><img src="${surface}-${t.id}.jpg" alt="${surface} ${t.fonts} Overview"></div>`).join('')}</div></section>`).join('');</script></body></html>
