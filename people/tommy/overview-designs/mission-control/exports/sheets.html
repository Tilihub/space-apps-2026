<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mission Control comparisons</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;color:#182538;font-family:system-ui,sans-serif}body{width:1280px;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.04em}.head p{font-size:11px;margin:6px 0 0;color:#59677a}.group{font-size:11px;font-weight:750;letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}article{min-width:0}img{width:100%;display:block;border:1px solid #c9d0db;border-radius:8px;box-shadow:0 5px 15px #283c500b}.label{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.label b{font-size:16px}.label small{font-size:10px;color:#57667a}.label span{display:inline-block;padding:3px 6px;border-radius:4px;background:#233348;color:white;font-size:13px;margin-right:7px}.swatches{display:flex;gap:4px}.swatches i{display:block;border-radius:50%;width:13px;height:13px;border:1px solid #0002}.bottom{display:flex;justify-content:space-between;font-size:10px;color:#586a80;margin-top:22px;letter-spacing:.02em}</style></head><body><div class="head"><div><h1>PULSE / Mission Control refinements</h1><p>Carbon + amber + segmented rings. Same overview data and features; visual refinements only.</p></div><div class="group" id="range"></div></div><div class="grid" id="grid"></div><div class="bottom"><span>Mission Control selected as direction · Variants pending · Presentation only</span><span>2026 / TEAM DESIGN REVIEW</span></div><script type="module">const all=await fetch('../themes.json').then(r=>r.json());const group=Math.max(1,Math.min(2,Number(new URLSearchParams(location.search).get('group')??1)));const rows=all.slice((group-1)*4,group*4);document.getElementById('range').textContent=rows[0].id+' — '+rows.at(-1).id;document.getElementById('grid').innerHTML=rows.map(t=>`<article><div class="label"><div><b><span>${t.id}</span>${t.name}</b><br><small>${t.palette} · ${t.font}${t.display!==t.font?' + '+t.display:''}</small></div><div class="swatches">${[t.bg,t.surface,t.accent,t.secondary].map(c=>`<i style="background:${c}"></i>`).join('')}</div></div><img src="${t.id}.jpg" alt="${t.id} ${t.name} Overview screenshot"></article>`).join('');</script></body></html>
