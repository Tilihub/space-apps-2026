<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory checks</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px 16px; background: #fff; color: #1b2230; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .pass { color: #1b7444; }
    .fail { color: #b02020; font-weight: 700; }
    #summary { font-weight: 700; font-size: 17px; }
    li { margin: 4px 0; }
    .detail { color: inherit; opacity: .8; font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      body { background: #0e131b; color: #e5eaf2; }
      .pass { color: #63d295; }
      .fail { color: #ff7f7f; }
    }
  </style>
</head>
<body>
  <h1>Inventory regression checks</h1>
  <p>Grants and dose-by-dose collection (DAD-1), validity, cancelling, ground tool and QR (DAD-2). Uses the sample data and fixed times on 14 Nov 2026.</p>
  <p id="summary"></p>
  <ol id="results"></ol>
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="qr.js"></script>
  <script src="ground.js"></script>
  <script src="tests.js"></script>
</body>
</html>
